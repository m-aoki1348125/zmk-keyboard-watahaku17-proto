CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y  # Temporarily disabled due to v0.3 compatibility issue
CONFIG_ZMK_STATUS_LED=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=9000000
CONFIG_ZMK_NON_LIPO_MIN_MV=1000
CONFIG_ZMK_NON_LIPO_LOW_MV=900
CONFIG_ZMK_SCROLL_SNAP=y
CONFIG_ZMK_SCROLL_SNAP_MAX_BUF_SIZE=16
CONFIG_LAYOUT_SHIFT_TARGET_JIS=y
CONFIG_LAYOUT_SHIFT_PERSISTENT_STATE=y

# DYA Studio Settings
# BLE Management (Bluetooth経由での設定変更)
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Battery History (バッテリー履歴表示)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_SETTINGS=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# Settings RPC (Web UIからの設定変更)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Runtime Input Processor (トラックボール感度のランタイム調整)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y